    <!-- Measurement. One constant to change.
         GA_ID is the GA4 measurement ID for the tenmaypcba.com web stream. If it
         is ever blanked or reverted to the placeholder, nothing is fetched and
         no request leaves the page, so a missing or wrong property can never
         break rendering. The listeners live here rather than inside React because
         these pages are prerendered: a CTA is already clickable in the served
         HTML, and a click on it should still be counted when the bundle is
         slow, blocked or broken.
         Collected: CTA clicks, first focus in the quote form, form outcome,
         WhatsApp / phone / mail clicks. No email address, no company name, no
         text typed into any field. -->
    <script>
      (function () {
        var GA_ID = 'G-QSX2B7T8L';
        var configured = /^G-[A-Z0-9]{6,}$/.test(GA_ID) && GA_ID.indexOf('XXXX') === -1;

        window.dataLayer = window.dataLayer || [];
        window.gtag = window.gtag || function () { window.dataLayer.push(arguments); };

        if (configured) {
          var s = document.createElement('script');
          s.async = true;
          s.src = 'https://www.googletagmanager.com/gtag/js?id=' + GA_ID;
          document.head.appendChild(s);
          window.gtag('js', new Date());
          window.gtag('config', GA_ID, { send_page_view: true });
        }

        window.tmTrack = function (name, params) {
          if (!configured) return;
          window.gtag('event', name, params || {});
        };

        document.addEventListener('click', function (e) {
          var el = e.target && e.target.closest ? e.target.closest('a,button') : null;
          if (!el) return;
          var href = (el.getAttribute('href') || '').toLowerCase();
          var text = (el.textContent || '').replace(/\s+/g, ' ').trim().slice(0, 60);
          if (href.indexOf('wa.me') > -1 || href.indexOf('whatsapp') > -1) {
            window.tmTrack('whatsapp_click', { label: text });
            return;
          }
          if (href.indexOf('tel:') === 0) { window.tmTrack('tel_click', { label: text }); return; }
          if (href.indexOf('mailto:') === 0) { window.tmTrack('email_click', { label: text }); return; }
          // The submit button lives inside the form; the form's own events cover it.
          if (el.tagName === 'BUTTON' && el.closest('#rfq')) return;
          if (href.indexOf('#rfq') > -1 || /get a quote|ask an engineer|request a quote|upload bom/i.test(text)) {
            window.tmTrack('quote_cta_click', { label: text });
          }
        }, true);

        var started = false;
        document.addEventListener('focusin', function (e) {
          if (started) return;
          var t = e.target;
          if (!t || !t.closest || !t.closest('#rfq')) return;
          if (!/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)) return;
          started = true;
          window.tmTrack('form_start', { form: 'rfq' });
        }, true);
      })();
    </script>
