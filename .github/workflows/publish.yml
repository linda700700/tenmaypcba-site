name: Build and publish

# Push to src to publish. main holds only the built output, so editing a file
# there does nothing; src is the branch that gets built.
on:
  push:
    branches: [src]
  workflow_dispatch:

permissions:
  contents: write
  pages: read

concurrency:
  group: publish
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npx vite build

      - name: Publish dist to main
        id: publish
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          rm -rf publish
          mkdir publish
          cd publish
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth=1 origin main
          git checkout -q -B main FETCH_HEAD

          # .git must be excluded or this delete removes the repository itself.
          # The three excluded files are Pages settings that are not build output:
          # the custom domain, the Jekyll opt-out and the domain verification token.
          rsync -a --delete \
            --exclude '.git' \
            --exclude 'CNAME' \
            --exclude '.nojekyll' \
            --exclude '47f21dfb48da328caa9209536c92dfc6.txt' \
            "$GITHUB_WORKSPACE/dist/" .

          git add -A
          if git diff --cached --quiet; then
            echo "Build matches what is already published; nothing to commit."
            echo "sha=none" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -q -m "Publish build ${GITHUB_SHA:0:8}"
          git push -q origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "Published."

      # Pages rebuilds from main asynchronously after the push above. Tell
      # IndexNow only once THAT build is serving, otherwise the crawler is
      # invited to fetch the previous one, or a 404 on a brand-new URL.
      #
      # `/pages/builds/latest` reports the last build the Pages service ran, so
      # checking only `status == built` matches the *previous* deployment and
      # proves nothing. Compare its commit with the one just pushed instead, and
      # skip entirely when the publish step had nothing to commit.
      # Bounded and non-blocking: 20 x 8s, then proceed regardless.
      - name: Wait for Pages deployment
        if: steps.publish.outputs.sha != '' && steps.publish.outputs.sha != 'none'
        continue-on-error: true
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WANT: ${{ steps.publish.outputs.sha }}
        run: |
          echo "Waiting for Pages to build ${WANT:0:8}."
          for attempt in $(seq 1 20); do
            code=$(curl -s -o "$RUNNER_TEMP/pages.json" -w '%{http_code}' \
              -H "Authorization: Bearer ${TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds/latest")
            if [ "$code" != "200" ]; then
              echo "Pages status unavailable (HTTP $code); not waiting."
              exit 0
            fi
            read -r state commit < <(python3 -c "import json,sys;d=json.load(open(sys.argv[1]));print(d.get('status',''),d.get('commit',''))" "$RUNNER_TEMP/pages.json")
            echo "Pages build: ${state:-unknown} at ${commit:0:8} (attempt ${attempt}/20)"
            if [ "$state" = "built" ] && [ "$commit" = "$WANT" ]; then
              echo "Deployment of ${WANT:0:8} is live; safe to notify IndexNow."
              exit 0
            fi
            sleep 8
          done
          echo "Pages did not report ${WANT:0:8} built within ~2.5 min; submitting anyway."

      # Push the built URLs at Bing/Yandex instead of waiting for a recrawl.
      # Google does not use IndexNow; Search Console stays the channel there.
      # Runs AFTER the deploy so every notified URL already resolves.
      - name: Ping IndexNow
        continue-on-error: true
        env:
          INDEXNOW_KEY: 975e87a7768d3a87f23715e3407174cb
        run: python3 .github/indexnow.py
