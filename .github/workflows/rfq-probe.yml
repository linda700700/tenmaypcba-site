name: RFQ intake probe

# Manual only. Runs from a GitHub-hosted runner, which is a network outside
# mainland China, so it can reach the intake endpoint that *.workers.dev
# resolves to from there but not from an office in Shenzhen.
#
# Purpose: prove the intake path end to end without a browser. Checks the CORS
# preflight the page depends on, the three rejection branches, and then one real
# submission. The real submission writes a row to the workbench, so it is opt-in
# via the write_test_row input.

on:
  # Editing this file is the trigger: the push that changes it runs the probe
  # exactly once, and nothing else ever does. workflow_dispatch is kept for a
  # future where src becomes the default branch.
  push:
    paths:
      - '.github/workflows/rfq-probe.yml'
  workflow_dispatch:
    inputs:
      write_test_row:
        description: 'Submit one real inquiry (writes a row you must delete afterwards)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Preflight, rejections, and optional real submission
        env:
          INTAKE: https://tenmay-rfq-intake.tenmaypcba.workers.dev
          ORIGIN: https://tenmaypcba.com
          WRITE_ROW: ${{ inputs.write_test_row || 'false' }}
        run: |
          set -uo pipefail

          hr() { printf '\n--- %s ---\n' "$1"; }

          hr '1. OPTIONS preflight (what the browser sends first)'
          curl -sS -i -X OPTIONS "$INTAKE" \
            -H "Origin: $ORIGIN" \
            -H 'Access-Control-Request-Method: POST' \
            -H 'Access-Control-Request-Headers: content-type' \
            -m 30 | sed -n '1,20p'

          hr '2. POST with no company -> expect 400 company required'
          curl -sS -X POST "$INTAKE" -H "Origin: $ORIGIN" \
            -H 'content-type: application/json' \
            -d '{"company":"","need":"probe"}' -m 30 \
            -w '\nhttp=%{http_code}\n'

          hr '3. POST with a malformed email -> expect 400 invalid email'
          curl -sS -X POST "$INTAKE" -H "Origin: $ORIGIN" \
            -H 'content-type: application/json' \
            -d '{"company":"probe","email":"not-an-email","need":"probe"}' -m 30 \
            -w '\nhttp=%{http_code}\n'

          hr '4. POST with the honeypot filled -> expect 400 rejected'
          curl -sS -X POST "$INTAKE" -H "Origin: $ORIGIN" \
            -H 'content-type: application/json' \
            -d '{"company":"probe","need":"probe","website":"http://spam.example"}' -m 30 \
            -w '\nhttp=%{http_code}\n'

          if [ "$WRITE_ROW" != "true" ]; then
            hr '5. Real submission skipped (write_test_row was not enabled)'
            exit 0
          fi

          hr '5. Real submission -> expect 201 with a reference'
          curl -sS -X POST "$INTAKE" -H "Origin: $ORIGIN" \
            -H 'content-type: application/json' -m 30 \
            -d '{"company":"PIPELINE TEST - DELETE ME","email":"pipeline.test@example.com","channel":"form","process":"turnkey","quantity":50,"need":"Automated end-to-end test of the RFQ intake. Created by the rfq-probe workflow. Safe to delete.","website":""}' \
            -w '\nhttp=%{http_code}\n'
