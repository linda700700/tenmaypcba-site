name: server

# Runs an ops/ script on the Hong Kong box (47.82.97.141) from a GitHub runner,
# because the workstation this repo is edited from has no outbound SSH.
#
# Why the push trigger: workflow_dispatch only works for files on the default
# branch, and the default branch here (main) is wiped by the publish build on
# every push to src. So this lives on its own branch, ops-run, and runs on push.
#
# What to run is read from ops/.trigger on the same branch:
#     script: ops/provision.sh
#     dry: 0
#
# Setup, once — Settings → Secrets and variables → Actions → New repository secret:
#     SWAS_ROOT_PASSWORD = the root password set in the Alibaba Cloud console
#   (this repo currently uses the name TENMAYPCBA; both names are accepted)
# The value is never printed and never returned to the caller. Once the box is
# provisioned: delete the secret and reset the root password.

on:
  push:
    branches: [ops-run]

concurrency:
  group: server-ops-run
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: read ops/.trigger
        id: t
        run: |
          SCRIPT="ops/provision.sh"; DRY="0"
          if [ -f ops/.trigger ]; then
            S="$(awk -F': *' '/^script:/{print $2}' ops/.trigger | tr -d ' \r')"
            D="$(awk -F': *' '/^dry:/{print $2}' ops/.trigger | tr -d ' \r')"
            [ -n "$S" ] && SCRIPT="$S"
            [ -n "$D" ] && DRY="$D"
          fi
          case "$SCRIPT" in
            ops/provision.sh|ops/enable-tls.sh|ops/probe-live.sh|ops/set-anon-key.sh|ops/set-bot.sh|ops/inspect-inbox.sh|ops/browser-contract.sh) ;;
            *) echo "::error::refusing to run '$SCRIPT'"; exit 1 ;;
          esac
          echo "script=$SCRIPT" >> "$GITHUB_OUTPUT"
          echo "dry=$DRY"       >> "$GITHUB_OUTPUT"
          echo "will run $SCRIPT (dry=$DRY)"

      - name: check secret
        env:
          SWAS_PASS: ${{ secrets.SWAS_ROOT_PASSWORD || secrets.TENMAYPCBA }}
        run: |
          if [ -z "$SWAS_PASS" ]; then
            echo "::error::no root password secret found — expected SWAS_ROOT_PASSWORD or TENMAYPCBA under Settings → Secrets and variables → Actions"
            exit 1
          fi
          echo "secret present (${#SWAS_PASS} chars)"

      - name: connect
        env:
          SSHPASS: ${{ secrets.SWAS_ROOT_PASSWORD || secrets.TENMAYPCBA }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
          for i in 1 2 3; do
            if sshpass -e ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
                 -o ConnectTimeout=15 -p 22 root@47.82.97.141 \
                 'echo connected; hostname; uname -sr; nproc; free -h | awk "/^Mem:/{print \$2}"; df -h / | tail -1'; then
              exit 0
            fi
            echo "attempt $i failed, retrying in 10s"; sleep 10
          done
          echo "::error::cannot reach 47.82.97.141:22 from the runner — check the SWAS firewall rules (allow 22) and that the instance is running"
          exit 1

      - name: run script
        env:
          SSHPASS: ${{ secrets.SWAS_ROOT_PASSWORD || secrets.TENMAYPCBA }}
          SCRIPT: ${{ steps.t.outputs.script }}
          DRY: ${{ steps.t.outputs.dry }}
          # Three spellings are accepted on purpose. GitHub rejects a secret
          # name containing a stray space with a generic message, and the
          # obvious fix is to retype a shorter name — so the shorter ones work
          # here too instead of costing another round trip.
          TENMAY_BOT_PASS: ${{ secrets.TENMAY_BOT_PASS || secrets.TENMAYBOTPASS || secrets.BOTPASS }}
          BOT_EMAIL: bot@tenmaypcba.com
        run: |
          set -o pipefail
          if [ "$DRY" = "1" ]; then
            echo "--- dry run: read-only inventory, nothing is changed ---"
            sshpass -e ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -p 22 root@47.82.97.141 \
              'cat /etc/os-release | head -2; echo; df -h /; echo; free -h; echo; ss -lntp 2>/dev/null | head -20; echo; echo "docker: $(docker --version 2>/dev/null || echo not installed)"; echo "caddy: $(caddy version 2>/dev/null | head -1 || echo not installed)"; echo; ls -la /opt 2>/dev/null'
            exit 0
          fi
          test -s "$SCRIPT" || { echo "::error::$SCRIPT missing"; exit 1; }
          echo "--- streaming $SCRIPT over ssh ---"
          # The bot password travels inside the ssh command environment, not in
          # the script on disk, so it never lands in the repository. The remote
          # script prints only its length, never the value.
          sshpass -e ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=20 -p 22 root@47.82.97.141 \
            "BOT_EMAIL='$BOT_EMAIL' BOT_PASS='${TENMAY_BOT_PASS}' bash -s" < "$SCRIPT" 2>&1 \
            | tee /tmp/run.log
          if grep -qE 'phase (1|2) complete|probe complete: all checks passed|inbox list complete|browser contract complete: all checks passed' /tmp/run.log; then
            echo "::notice::$SCRIPT reported completion"
          else
            echo "::error::$SCRIPT did not reach its completion marker — read the log above"
            exit 1
          fi

      - name: verify from outside
        if: always()
        run: |
          echo "== DNS =="
          for h in api.tenmaypcba.com rt.tenmaypcba.com; do
            echo "$h -> $(dig +short "$h" @8.8.8.8 | tr '\n' ' ')"
          done
          echo "== HTTPS =="
          for h in api.tenmaypcba.com rt.tenmaypcba.com; do
            code=$(curl -sS -o /tmp/h.txt -m 15 -w '%{http_code}' "https://$h/healthz" 2>/dev/null || true)
            echo "https://$h/healthz -> ${code:-000} $(head -c 160 /tmp/h.txt 2>/dev/null)"
          done
          echo "== direct IP =="
          curl -sS -o /dev/null -m 10 -w 'http://47.82.97.141 -> %{http_code}\n' http://47.82.97.141 2>/dev/null || echo "http://47.82.97.141 -> no answer (expected before phase 2)"
