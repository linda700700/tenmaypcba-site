name: server

# Runs an ops/ script on the Hong Kong box (47.82.97.141) from a GitHub runner,
# because the workstation this repo is edited from has no outbound SSH.
#
# Why the push trigger: workflow_dispatch only works for files on the default
# branch, and the default branch here (main) is wiped by the publish build on
# every push to src. So this lives on its own branch, ops-run, and runs on push.
#
# What to run is read from ops/.trigger on the same branch:
#     script: ops/provision.sh
#     dry: 0
#
# Authentication, in order of preference:
#     SWAS_SSH_KEY       — the private key whose public half ops/install-ssh-key.sh
#                          authorised. Used with BatchMode, so a missing or
#                          wrong key fails instead of quietly falling back.
#     SWAS_ROOT_PASSWORD / TENMAYPCBA — legacy: the root password.
# Once a key is installed, delete the password secret and rotate the password in
# the Alibaba Cloud console: a password that exists anywhere is a password that
# can leak somewhere.

on:
  push:
    branches: [ops-run]

concurrency:
  group: server-ops-run
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: read ops/.trigger
        id: t
        run: |
          SCRIPT="ops/provision.sh"; DRY="0"
          if [ -f ops/.trigger ]; then
            S="$(awk -F': *' '/^script:/{print $2}' ops/.trigger | tr -d ' \r')"
            D="$(awk -F': *' '/^dry:/{print $2}' ops/.trigger | tr -d ' \r')"
            [ -n "$S" ] && SCRIPT="$S"
            [ -n "$D" ] && DRY="$D"
          fi
          case "$SCRIPT" in
            ops/provision.sh|ops/enable-tls.sh|ops/probe-live.sh|ops/set-anon-key.sh|ops/set-bot.sh|ops/inspect-inbox.sh|ops/browser-contract.sh|ops/install-ssh-key.sh|ops/lockdown-ssh.sh|ops/verify-keyonly.sh|ops/gsc-install.sh) ;;
            *) echo "::error::refusing to run '$SCRIPT'"; exit 1 ;;
          esac
          echo "script=$SCRIPT" >> "$GITHUB_OUTPUT"
          echo "dry=$DRY"       >> "$GITHUB_OUTPUT"
          echo "will run $SCRIPT (dry=$DRY)"

      # One wrapper, so the two ssh calls below cannot drift apart on auth.
      - name: prepare ssh
        env:
          SSH_KEY: ${{ secrets.SWAS_SSH_KEY }}
          SSH_PASS: ${{ secrets.SWAS_ROOT_PASSWORD || secrets.TENMAYPCBA }}
        run: |
          set -uo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          if [ -n "${SSH_KEY:-}" ]; then
            printf '%s\n' "$SSH_KEY" > ~/.ssh/id_tenmay
            chmod 600 ~/.ssh/id_tenmay
            AUTH=key
            echo "auth: key (${#SSH_KEY} chars)"
          elif [ -n "${SSH_PASS:-}" ]; then
            AUTH=password
            echo "::warning::no SWAS_SSH_KEY — falling back to the root password"
            sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
          else
            echo "::error::no credentials — set SWAS_SSH_KEY (preferred) or SWAS_ROOT_PASSWORD"
            exit 1
          fi
          echo "AUTH=$AUTH" >> "$GITHUB_ENV"
          [ "$AUTH" = password ] && echo "::add-mask::$SSH_PASS" && echo "SSHPASS=$SSH_PASS" >> "$GITHUB_ENV"

          install -m 755 ops/tmssh.sh ./tmssh

      - name: connect
        run: |
          for i in 1 2 3; do
            if ./tmssh -o ConnectTimeout=15 -p 22 root@47.82.97.141 \
                 'echo connected; hostname; uname -sr; nproc; free -h | awk "/^Mem:/{print \$2}"; df -h / | tail -1' </dev/null; then
              echo "authenticated via $AUTH"
              exit 0
            fi
            echo "attempt $i failed, retrying in 10s"; sleep 10
          done
          echo "::error::cannot reach 47.82.97.141:22 as root — check the SWAS firewall (allow 22), the instance state, and that the key is authorised"
          exit 1

      - name: run script
        env:
          SCRIPT: ${{ steps.t.outputs.script }}
          DRY: ${{ steps.t.outputs.dry }}
          # Three spellings are accepted on purpose. GitHub rejects a secret
          # name containing a stray space with a generic message, and the
          # obvious fix is to retype a shorter name — so the shorter ones work
          # here too instead of costing another round trip.
          TENMAY_BOT_PASS: ${{ secrets.TENMAY_BOT_PASS || secrets.TENMAYBOTPASS || secrets.BOTPASS }}
          BOT_EMAIL: bot@tenmaypcba.com
          # The Search Console service-account key. Same rule as the bot
          # password: it travels through the runner's environment and an ssh
          # stream, never through the repository or a log line.
          GSC_SA_JSON: ${{ secrets.GSC_SA_JSON }}
        run: |
          set -o pipefail
          if [ "$DRY" = "1" ]; then
            echo "--- dry run: read-only inventory, nothing is changed ---"
            ./tmssh -p 22 root@47.82.97.141 \
              'cat /etc/os-release | head -2; echo; df -h /; echo; free -h; echo; ss -lntp 2>/dev/null | head -20; echo; echo "docker: $(docker --version 2>/dev/null || echo not installed)"; echo "caddy: $(caddy version 2>/dev/null | head -1 || echo not installed)"; echo; ls -la /opt 2>/dev/null' </dev/null
            exit 0
          fi
          test -s "$SCRIPT" || { echo "::error::$SCRIPT missing"; exit 1; }
          if [ "$SCRIPT" = "ops/gsc-install.sh" ]; then
            [ -n "${GSC_SA_JSON:-}" ] || { echo "::error::secret GSC_SA_JSON is empty - add the service-account json to repo secrets"; exit 1; }
            echo "key: ${#GSC_SA_JSON} chars, streaming to /opt/tenmay/secrets/gsc.json"
            printf '%s' "$GSC_SA_JSON" | ./tmssh -p 22 root@47.82.97.141 \
              'umask 077; mkdir -p /opt/tenmay/secrets; chmod 700 /opt/tenmay/secrets; cat > /opt/tenmay/secrets/gsc.json'
            echo "key placed on the box"
          fi
          echo "--- streaming $SCRIPT over ssh (auth: $AUTH) ---"
          # The bot password travels inside the ssh command environment, not in
          # the script on disk, so it never lands in the repository. The remote
          # script prints only its length, never the value.
          ./tmssh -p 22 root@47.82.97.141 \
            "BOT_EMAIL='$BOT_EMAIL' BOT_PASS='${TENMAY_BOT_PASS}' bash -s" < "$SCRIPT" 2>&1 \
            | tee /tmp/run.log
          if grep -qE 'phase (1|2) complete|probe complete: all checks passed|inbox list complete|browser contract complete: all checks passed|ssh key install complete|ssh lockdown complete|ssh key-only verify complete|gsc install complete' /tmp/run.log; then
            echo "::notice::$SCRIPT reported completion"
          else
            echo "::error::$SCRIPT did not reach its completion marker — read the log above"
            exit 1
          fi

      - name: verify from outside
        if: always()
        run: |
          echo "== DNS =="
          for h in api.tenmaypcba.com rt.tenmaypcba.com; do
            echo "$h -> $(dig +short "$h" @8.8.8.8 | tr '\n' ' ')"
          done
          echo "== HTTPS =="
          for h in api.tenmaypcba.com rt.tenmaypcba.com; do
            code=$(curl -sS -o /tmp/h.txt -m 15 -w '%{http_code}' "https://$h/healthz" 2>/dev/null || true)
            echo "https://$h/healthz -> ${code:-000} $(head -c 160 /tmp/h.txt 2>/dev/null)"
          done
          echo "== direct IP =="
          curl -sS -o /dev/null -m 10 -w 'http://47.82.97.141 -> %{http_code}\n' http://47.82.97.141 2>/dev/null || echo "http://47.82.97.141 -> no answer (expected before phase 2)"
