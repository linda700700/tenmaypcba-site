name: RFQ browser e2e

# Proves the funnel a real visitor gets: headless Chrome loads the live page,
# fills the form, clicks send, and asserts the success panel. The server-side
# replay in ops/browser-contract.sh cannot catch a broken bundle or a thrown
# React handler; only a browser can.
#
# It writes one inquiry row on purpose — that is the proof — and marks it
# SAMPLE ROW so ops/inspect-inbox.sh deletes it afterwards.
on:
  push:
    branches: [ops-run]
    paths:
      - '.github/workflows/browser-e2e.yml'
      - 'ops/browser-e2e/run.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install puppeteer-core
        run: npm init -y >/dev/null 2>&1 && npm i puppeteer-core@23 --no-audit --no-fund

      - name: Resolve a Chrome binary
        run: |
          for c in /usr/bin/google-chrome /usr/bin/google-chrome-stable /usr/bin/chromium-browser /usr/bin/chromium; do
            if [ -x "$c" ]; then echo "CHROME_PATH=$c" >> "$GITHUB_ENV"; echo "using $c"; exit 0; fi
          done
          echo "::error::no chrome binary on this runner"
          exit 1

      - name: Run the funnel in a real browser
        env:
          STAMP: ${{ github.run_id }}
        run: node ops/browser-e2e/run.mjs

      - name: Keep the screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rfq-e2e-screenshot
          path: rfq-success.png
          if-no-files-found: warn

      # A verified submission still leaves a row behind, and a row in the inbox
      # looks exactly like a real lead. Remove only the row this run wrote: the
      # company column carries the marker and the run id.
      - name: Remove the row this check created
        if: always()
        env:
          BOT_EMAIL: bot@tenmaypcba.com
          BOT_PASS: ${{ secrets.TENMAY_BOT_PASS || secrets.TENMAYBOTPASS || secrets.BOTPASS }}
          SITE_ID: q5o1kzml5qqstngt
          STAMP: ${{ github.run_id }}
        run: |
          set -uo pipefail
          if [ -z "${BOT_PASS:-}" ]; then
            echo "::warning::no bot password secret; leaving the check row for ops/inspect-inbox.sh"
            exit 0
          fi
          BASE="https://site-builder.alibaba.com/supabase/v1/sites/$SITE_ID"
          ANON="eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJyb2xlIjoiYW5vbiIsImlzcyI6InBvbGFyZGIiLCJpYXQiOjE3OTAxNDQyNjksImV4cCI6MjEwNTUwNDI2OX0.iE1UtbF8SYx-v6I-3Kbm6aj-ulMtENANW1QLf6goUSg"
          TOK="$(curl -sS -m 20 -X POST "$BASE/auth/v1/token?grant_type=password" \
            -H 'content-type: application/json' -H "apikey: $ANON" \
            --data "$(printf '{"email":"%s","password":"%s"}' "$BOT_EMAIL" "$BOT_PASS")" </dev/null 2>/dev/null \
            | sed -nE 's/.*"access_token":"([^"]+)".*/\1/p')"
          if [ -z "$TOK" ]; then
            echo "::warning::could not sign in; leaving the check row for ops/inspect-inbox.sh"
            exit 0
          fi
          curl -sS -m 20 -X DELETE "$BASE/rest/v1/inquiries?customer=like.SAMPLE%20ROW*" \
            -H "apikey: $ANON" -H "authorization: Bearer $TOK" \
            -H 'prefer: return=representation' </dev/null 2>/dev/null \
            | python3 -c '
import json,sys
raw=sys.stdin.read()
try: rows=json.loads(raw)
except Exception: print("cleanup raw:", raw[:200]); raise SystemExit
print("cleanup removed:", [r.get("id") for r in rows] if isinstance(rows,list) else raw[:200])
'
